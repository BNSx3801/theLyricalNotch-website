<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bars to Smile</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0b0f;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: min(80vw, 640px);
    height: auto;
    overflow: visible;
  }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg" aria-label="Animated equalizer morphing into a smiley">
  <defs>
    <!-- Gradient runs left to right in user space: blue -> purple -> pink -> orange -->
    <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="200" y2="0">
      <stop offset="0"    stop-color="#38bdf8"/>
      <stop offset="0.45" stop-color="#8b5cf6"/>
      <stop offset="0.75" stop-color="#ec4899"/>
      <stop offset="1"    stop-color="#fb923c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g id="shapes" filter="url(#glow)" stroke="url(#grad)" stroke-linecap="round"></g>
</svg>

<script>
(function () {
  const SVG_NS = "http://www.w3.org/2000/svg";
  const group = document.getElementById("shapes");

  const N = 7;                       // number of bars
  const CY = 70;                     // vertical centre of the equalizer
  const XS = [40, 66.67, 93.33, 120, 146.67, 173.33, 200];
  const WIDTH = 7;

  // Timeline (ms) inside one loop
  const EQ_END   = 1800;             // equalizer playing
  const IN_END   = 4800;             // morph bars -> smiley (3 s)
  const HOLD_END = 6800;             // smiley holds
  const OUT_END  = 9800;             // morph smiley -> bars (3 s)
  const MORPH_MS = 3000;

  // Smile: quadratic curve, same blue -> orange sweep as the SVG
  const P0 = { x: 60,  y: 80 };
  const P1 = { x: 120, y: 130 };
  const P2 = { x: 180, y: 80 };
  function bez(t) {
    const u = 1 - t;
    return {
      x: u * u * P0.x + 2 * u * t * P1.x + t * t * P2.x,
      y: u * u * P0.y + 2 * u * t * P1.y + t * t * P2.y
    };
  }

  // Create one <line> per bar
  const lines = [];
  for (let i = 0; i < N; i++) {
    const l = document.createElementNS(SVG_NS, "line");
    group.appendChild(l);
    lines.push(l);
  }

  // Final shape targets: bars 1 and 5 become eyes, the other five form the smile arc
  const targets = new Array(N);
  targets[1] = { x: 76,  y: 48, len: 22, ang: Math.PI / 2, w: WIDTH };
  targets[5] = { x: 164, y: 48, len: 22, ang: Math.PI / 2, w: WIDTH };

  const arcBars = [0, 2, 3, 4, 6];
  const T_START = 0.1, T_END = 0.9;
  const step = (T_END - T_START) / arcBars.length;
  arcBars.forEach((barIndex, k) => {
    const t0 = T_START + k * step;
    const t1 = t0 + step;
    const a = bez(t0), b = bez(t1);
    const mid = bez((t0 + t1) / 2);
    const dx = b.x - a.x, dy = b.y - a.y;
    targets[barIndex] = {
      x: mid.x,
      y: mid.y,
      len: Math.hypot(dx, dy) + 3,      // slight overlap so the segments join
      ang: Math.atan2(dy, dx),
      w: WIDTH
    };
  });

  // Equalizer motion for each bar, driven by absolute time in seconds
  const FREQ  = [1.7, 2.3, 1.9, 2.6, 2.1, 2.4, 1.8];
  const PHASE = [0, 1.3, 2.1, 0.6, 1.9, 2.8, 0.9];
  function eqState(i, sec) {
    const h = 0.5 + 0.5 * Math.sin(2 * Math.PI * FREQ[i] * sec + PHASE[i]);
    return { x: XS[i], y: CY, len: 16 + 64 * h, ang: Math.PI / 2, w: WIDTH };
  }

  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  // Each bar starts a little after the previous one (stagger up to 15% of the morph)
  function morphState(from, to, tp, i) {
    const delay = 0.15 * (i / (N - 1));
    const p = Math.min(1, Math.max(0, (tp - delay) / (1 - 0.15)));
    const e = easeInOutCubic(p);
    return {
      x:   from.x   + (to.x   - from.x)   * e,
      y:   from.y   + (to.y   - from.y)   * e,
      len: from.len + (to.len - from.len) * e,
      ang: from.ang + (to.ang - from.ang) * e,
      w:   from.w   + (to.w   - from.w)   * e
    };
  }

  function draw(i, s) {
    const cx = Math.cos(s.ang) * s.len / 2;
    const cy = Math.sin(s.ang) * s.len / 2;
    const l = lines[i];
    l.setAttribute("x1", (s.x - cx).toFixed(2));
    l.setAttribute("y1", (s.y - cy).toFixed(2));
    l.setAttribute("x2", (s.x + cx).toFixed(2));
    l.setAttribute("y2", (s.y + cy).toFixed(2));
    l.setAttribute("stroke-width", s.w.toFixed(2));
  }

  const start = performance.now();
  let lastPhase = null;
  let from = [];
  const cur = new Array(N);

  function frame(now) {
    const c = (now - start) % OUT_END;
    const sec = now / 1000;
    let phase, tp = 0;

    if (c < EQ_END) {
      phase = "eq";
    } else if (c < IN_END) {
      phase = "in";
      tp = (c - EQ_END) / MORPH_MS;
    } else if (c < HOLD_END) {
      phase = "hold";
    } else {
      phase = "out";
      tp = (c - HOLD_END) / MORPH_MS;
    }

    if (phase !== lastPhase) {
      from = cur.map(s => ({ ...s }));  // snapshot where the bars are right now
      lastPhase = phase;
    }

    for (let i = 0; i < N; i++) {
      let s;
      if (phase === "eq") {
        s = eqState(i, sec);
      } else if (phase === "in") {
        s = morphState(from[i], targets[i], Math.min(tp, 1), i);
      } else if (phase === "hold") {
        s = targets[i];
      } else {
        s = morphState(from[i], eqState(i, sec), Math.min(tp, 1), i);
      }
      cur[i] = s;
      draw(i, s);
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
